---
clone_folder: c:\project\s2spice
shallow_clone: false
clone_depth: 10

environment:
  CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

image: Visual Studio 2026

platform:
  - x64

configuration: RelWithDebInfo

init:
  - git config --global core.autocrlf input
  - set "VS_BASE=C:\Program Files\Microsoft Visual Studio\18"
  - call "%VS_BASE%\Community\VC\Auxiliary\Build\vcvars64.bat"

install:
  - git submodule update --init --recursive

build_script:
  - echo Starting AppVeyor build for %APPVEYOR_REPO_BRANCH%
  - call .\appveyor.bat

artifacts:
  - path: '.\build\*.exe'
    name: s2spice
